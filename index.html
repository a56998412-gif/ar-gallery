<!DOCTYPE html>
<html>
<head> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">   
    <title>Tiled 3D Library Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #wrap {
            overflow: hidden; 
            margin: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .tile {
            width: 300px;
            height: 280px;
            position: relative;
            background: #e9e9e9;
            text-align: center;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .tile:hover {
            transform: scale(1.02);
        }
        .boxInner {
            position: absolute;
            left: 20px;
            top: 10px;
            width: 260px;
            height: 240px;
            background: #ffffff;
            text-align: center;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2), 0 5px 20px rgba(0,0,0,0.17);
            border-radius: 4px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .boxInner img {
            max-width: 90%;
            max-height: 70%;
            object-fit: contain;
            margin-top: 5px;
        }
        .boxInner p {
            margin: 5px 0 0 0;
            font-size: 14px;
            font-weight: 500;
            color: #123;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
            padding: 0 5px;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #666;
        }
        .error {
            text-align: center;
            padding: 50px;
            color: #d32f2f;
        }
    </style>
</head>
<body> 
    <div id="wrap"><div class="loading">Loading gallery...</div></div>
    
    <script>
    // ВСЯ ЛОГИКА В ОДНОМ ВНЕШНЕМ СКРИПТЕ

    <script src="gallery-loader.js"></script>
</body>
</html>
